[project]
name = "quiz-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anony", email = "anonymoususer5761@gmail.com" }
]
requires-python = ">=3.14.8"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
quiz-app = "quiz_app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
